<article class="artist-card">
  <div class="artist-card__image">
    @if (artist().image && failedImage() !== artist().image) {
      <img [src]="artist().image" [alt]="artist().name + ' artist photo'"
        (error)="failedImage.set(artist().image)" />
    } @else {
      <div class="artist-card__placeholder" role="img" [attr.aria-label]="artist().name + ' — photo unavailable'">
        {{ artist().name.charAt(0).toUpperCase() }}
      </div>
    }
  </div>

  <div class="artist-card__body">
    <div>
      <h3>
        <a class="artist-card__link" [routerLink]="artist().id ? ['/app/artists', artist().id] : null">
          {{ artist().name }}
        </a>
      </h3>
      <p>{{ artist().genre }}</p>
    </div>
    <button type="button">Follow</button>
  </div>

  <footer>
    <span>{{ artist().albumCount }} albums</span>
    <span>{{ artist().followers }} followers</span>
  </footer>
</article>
